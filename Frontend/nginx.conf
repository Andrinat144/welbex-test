http {
    server {
        server_tokens off;
        listen  80;
        root    /usr/share/nginx/html;
        include /etc/nginx/mime.types;
        location / {
            try_files $uri $uri/ /index.html;
        }
        gzip            on;
        gzip_vary       on;
        gzip_http_version  1.0;
        gzip_comp_level 5;    
        gzip_types
                        application/javascript
                        application/json
                        application/xml
                        font/opentype
                        image/svg+xml
                        text/css
                        text/plain
        gzip_proxied    no-cache no-store private expired auth;
        gzip_min_length 256;
        gunzip          on;
    }
}
events{}