services:
  server:
    build: ./Backend
    ports:
      - '8000:8000'

    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./Frontend
    ports:
      - '80:80'

    env_file:
      - .env

    networks:
      - app-network

  db:
    image: postgres:latest
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_SCHEMA: ${DB_SHEMA}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT}:${DB_PORT}'
    networks:
      - app-network
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', '${DB_USER}']
      interval: 10s
      timeout: 5s
      retries: 3
volumes:
  db-data:

networks:
  app-network:
    driver: bridge
